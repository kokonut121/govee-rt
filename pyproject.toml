[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govee-rt"
version = "0.1.0"
description = "Real-time per-segment control of Govee strips over Wi-Fi or Bluetooth, with music-reactive effects"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
ble = ["bleak>=0.22"]
dev = ["pytest>=7"]

[project.scripts]
govee-rt = "govee_rt.cli:main"

[tool.setuptools]
packages = ["govee_rt"]

[tool.setuptools.package-data]
govee_rt = ["web/*", "presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
